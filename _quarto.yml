project:
  type: book
  output-dir: docs
profile:
  default: student
lang: fr
number-sections: false
language:
  title-block-author-single: "Auteur"
  title-block-author-plural: "Auteurs"
  author-title: "Auteur"
  authors-title: "Auteurs"

crossref:
  fig-prefix: Figure
  tbl-prefix: Tableau
  sec-prefix: Section
  eq-prefix: Équation
  chapters: false

book:
  title: "Cours d'Analyse"
  subtitle: "Formation Initiale — GI1"
  sidebar:
    logo: images/logo_estc.png
    tools:
      - icon: github
        href: https://github.com/iaousse/
        aria-label: GitHub
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/mbarekiaousse
        aria-label: LinkedIn
        target: _blank
  author: "IAOUSSE M'barek"
  search: true
  downloads:  [pdf, epub]
  chapters:
    - index.qmd
    - preface.qmd
    #- intro.md
    - part: R.md
      chapters:
        - rationnels.qmd
        - proprties.qmd
        - exo1.qmd
    - part: suite.md
      chapters:
        - suites.qmd
        - exo2.qmd
    - part: limitefct.md
      chapters:
        - limitefcts.qmd
        - exo3.qmd
    - part: dirivf.md
      chapters:
        - dirivfs.qmd
        - fcthycerinvs.qmd
        - exo5.qmd
    - part: complement.md
      chapters:
        - complements.qmd
        - dl.qmd
        - exo6.md
    - part: integrationd.md
      chapters:
        - fe.md
        - fcm.md
        - pptint.md
        - fcmint.md
        - pintfc.md
        - methodcalp.md
        - exoint.md
    - references.qmd

execute:
  freeze: auto

bibliography: references.bib
link-citations: true
citations-hover: true

format:
  html:
    theme:
      light: spacelab
      dark: darkly
    respect-user-color-scheme: false
    css: styles.css
    title-block-banner: true
    toc: false
    grid:
      body-width: 1200px
      margin-width: 0px
      sidebar-width: 250px
    code-copy: true
    smooth-scroll: true
    html-math-method: mathjax
    include-in-header:
      text: |

        <script>
        window.MathJax = {
          tex: {
            macros: {
              Z: "\\mathbb{Z}",
              N: "\\mathbb{N}",
              C: "\\mathbb{C}",
              Q: "\\mathbb{Q}",
              R: "\\mathbb{R}",
              B: "\\mathcal{B}",
              M: "\\mathcal{M}",
              S: "\\mathbb{S}",
              abs: ["\\left|#1\\right|", 1],
              norm: ["\\left\\Vert#1\\right\\Vert", 1],
              sign: "\\mathrm{sign}",
              vec: ["\\mathbf{#1}", 1]
            }
          }
        };
        </script>
  epub: default
  pdf:
    linkcolor:  blue
    documentclass: scrbook
    pdf-engine: xelatex
    fontsize: 11pt
    papersize: a4
    title-block: false
    toc: false
    toc-depth: 1
    number-sections: false
    colorlinks: true
    citeproc: true
    classoption:
      - open=any
    geometry:
      - top=24mm
      - bottom=24mm
      - left=25mm
      - right=25mm
    header-includes:
      - \usepackage{graphicx}
      - \usepackage{ragged2e}
      - \usepackage{microtype}
      - \setcounter{tocdepth}{0}
      - \definecolor{analyse-theorem}{HTML}{164E82}
      - \definecolor{analyse-proof}{HTML}{94520B}
      - \definecolor{analyse-definition}{HTML}{17665F}
      - \definecolor{analyse-example}{HTML}{496A2A}
      - \colorlet{quarto-callout-important-color}{analyse-theorem}
      - \colorlet{quarto-callout-important-color-frame}{analyse-theorem}
      - \colorlet{quarto-callout-caution-color}{analyse-proof}
      - \colorlet{quarto-callout-caution-color-frame}{analyse-proof}
      - \colorlet{quarto-callout-note-color}{analyse-definition}
      - \colorlet{quarto-callout-note-color-frame}{analyse-definition}
      - \colorlet{quarto-callout-tip-color}{analyse-example}
      - \colorlet{quarto-callout-tip-color-frame}{analyse-example}
      - |
        \makeatletter
        \renewcommand{\maketitle}{}
        \AtBeginDocument{\frontmatter\pagenumbering{gobble}\pagestyle{empty}}
        \let\ps@plain\ps@empty
        \makeatother
      - \newcommand{\Z}{\mathbb{Z}}
      - \newcommand{\N}{\mathbb{N}}
      - \newcommand{\C}{\mathbb{C}}
      - \newcommand{\Q}{\mathbb{Q}}
      - \newcommand{\R}{\mathbb{R}}
      - \newcommand{\B}{\mathcal{B}}
      - \newcommand{\M}{\mathcal{M}}
      - \newcommand{\abs}[1]{\left|#1\right|}
      - \newcommand{\norm}[1]{\left\Vert#1\right\Vert}
